<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>컬러별 화장품 - 퍼스널 컬러별 화장품 찾기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="index.html">퍼스널 컬러별 화장품 찾기</a>
      <nav class="site-nav" aria-label="페이지 메뉴">
        <a href="index.html" aria-current="page">컬러별 화장품</a>
        <a href="recommend.html">사용자 추천</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="필터">
      <div class="control-group">
        <h2 class="control-label" id="season-label">계절 유형</h2>
        <div class="button-row" role="group" aria-labelledby="season-label">
          <button type="button" class="season-btn" data-season="spring_warm" aria-pressed="false">봄 웜</button>
          <button type="button" class="season-btn" data-season="summer_cool" aria-pressed="false">여름 쿨</button>
          <button type="button" class="season-btn" data-season="autumn_warm" aria-pressed="false">가을 웜</button>
          <button type="button" class="season-btn" data-season="winter_cool" aria-pressed="false">겨울 쿨</button>
        </div>
      </div>
      <div class="control-group">
        <h2 class="control-label" id="type-label">제품군</h2>
        <div class="button-row" role="group" aria-labelledby="type-label">
          <button type="button" class="type-btn" data-type="all" aria-pressed="true">전체</button>
          <button type="button" class="type-btn" data-type="lipstick" aria-pressed="false">립스틱</button>
          <button type="button" class="type-btn" data-type="blush" aria-pressed="false">블러셔</button>
          <button type="button" class="type-btn" data-type="eyeshadow" aria-pressed="false">아이섀도</button>
        </div>
      </div>
    </section>

    <section id="results" aria-live="polite">
      <p class="message" id="message">위에서 계절 유형을 고르면 해당 유형의 셰이드가 표시됩니다.</p>
      <div id="season-header" class="season-header" hidden>
        <h2 id="season-title"></h2>
        <p id="result-count" class="result-count"></p>
      </div>
      <ul id="shade-list" class="shade-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>분류 기준은 프로젝트용 임시 규칙이며 전문 진단이 아닙니다.</p>
      <p>데이터 출처: Makeup API 데이터의 Kaggle 사본
        (<a href="https://www.kaggle.com/datasets/oftomorrow/herokuapp-makeup-products" target="_blank" rel="noopener noreferrer">Herokuapp Makeup Products</a>)</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
